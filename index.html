<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教室大时钟 · 时钟转盘</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.6vh, 20px);
    background: radial-gradient(120% 90% at 50% 0%, #f0f5ff 0%, #dde8fb 45%, #c9d8f4 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1b2a49;
    overflow: auto;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vw, 60px);
    flex-wrap: wrap;
    width: 100%;
    max-width: 1400px;
  }
  .left-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
  }
  .stage {
    aspect-ratio: 1 / 1;
    height: min(68vh, 55vw, 700px);
    filter: drop-shadow(0 16px 30px rgba(28, 54, 106, 0.22));
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  .stage svg text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #hourHand, #minuteHand {
    cursor: grab;
  }
  #hourHand:active, #minuteHand:active {
    cursor: grabbing;
  }
  .readout {
    margin-top: clamp(6px, 1.4vh, 18px);
    text-align: center;
  }
  .digital {
    font-size: clamp(26px, 4.8vh, 58px);
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #16305c;
    line-height: 1;
  }
  .date {
    margin-top: 0.5em;
    font-size: clamp(12px, 1.9vh, 20px);
    font-weight: 600;
    color: #61739a;
    letter-spacing: 0.06em;
  }
  .controls {
    margin-top: clamp(8px, 1.6vh, 18px);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls button {
    font-family: inherit;
    font-size: clamp(13px, 1.9vh, 18px);
    font-weight: 700;
    color: #16305c;
    background: #ffffff;
    border: 2px solid #b9c9e8;
    border-radius: 999px;
    padding: 0.5em 1.2em;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .controls button:hover { background: #eef4ff; border-color: #8aa8dd; }
  .controls button:active { transform: scale(0.95); }
  .question-panel {
    flex: 0 0 auto;
    text-align: left;
    line-height: 1.5;
    color: #16305c;
    min-width: 260px;
  }
  .question {
    font-size: clamp(24px, 4vh, 56px);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .answer {
    margin-top: 0.2em;
    font-size: clamp(24px, 4vh, 56px);
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .answer.hidden {
    visibility: hidden;
  }
</style>
</head>
<body>
<div class="main">
  <div class="left-panel">
    <div class="stage">
      <svg id="clock" viewBox="0 0 1000 1000" role="img" aria-label="时钟表盘">
        <defs>
          <radialGradient id="faceGrad" cx="50%" cy="40%" r="75%">
            <stop offset="0%"   stop-color="#ffffff"/>
            <stop offset="70%"  stop-color="#fbfdff"/>
            <stop offset="100%" stop-color="#e8f0fd"/>
          </radialGradient>
          <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#4468b5"/>
            <stop offset="100%" stop-color="#1b2f60"/>
          </linearGradient>
        </defs>
        <circle cx="500" cy="500" r="484" fill="url(#rimGrad)"/>
        <circle cx="500" cy="500" r="458" fill="url(#faceGrad)"/>
        <circle cx="500" cy="500" r="458" fill="none" stroke="#c6d5ef" stroke-width="2"/>
        <g id="ticks"></g>
        <image id="pinkFriend" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
               x="300" y="540" width="150" height="150" opacity="0.95" />
        <image id="blueFriend" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
               x="550" y="540" width="150" height="150" opacity="0.95" />
        <g id="numbers"></g>
        <g id="hands">
          <line id="hourHand"   x1="500" y1="545" x2="500" y2="270"
                stroke="#e63946" stroke-width="50" stroke-linecap="round"/>
          <line id="minuteHand" x1="500" y1="555" x2="500" y2="165"
                stroke="#2563eb" stroke-width="34" stroke-linecap="round"/>
        </g>
        <circle cx="500" cy="500" r="30" fill="#1b2a49"/>
        <circle cx="500" cy="500" r="12" fill="#ffffff"/>
      </svg>
    </div>
    <div class="readout">
      <div class="digital">
        <span id="d-hm">--:--</span>
      </div>
      <div class="date" id="date">—</div>
    </div>
    <div class="controls">
      <button id="btnHour">整点</button>
      <button id="btnHalf">半点</button>
      <button id="btnRandom">随机</button>
      <button id="btnLive">当前时间</button>
      <button id="btnShowAnswer">显示答案</button>
    </div>
  </div>
  <div class="question-panel">
    <div class="question">What time is it?</div>
    <div class="answer hidden" id="answer">It's __________</div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var CX = 500, CY = 500;

  var ticks = document.getElementById('ticks');
  var tickFrag = document.createDocumentFragment();
  for (var i = 0; i < 60; i++) {
    var ang = (i * 6) * Math.PI / 180;
    var big = (i % 5 === 0);
    var r1 = big ? 400 : 414;
    var r2 = 434;
    var line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', (CX + r1 * Math.sin(ang)).toFixed(2));
    line.setAttribute('y1', (CY - r1 * Math.cos(ang)).toFixed(2));
    line.setAttribute('x2', (CX + r2 * Math.sin(ang)).toFixed(2));
    line.setAttribute('y2', (CY - r2 * Math.cos(ang)).toFixed(2));
    line.setAttribute('stroke', big ? '#2c4374' : '#aec1e2');
    line.setAttribute('stroke-width', big ? 13 : 5);
    line.setAttribute('stroke-linecap', 'round');
    tickFrag.appendChild(line);
  }
  ticks.appendChild(tickFrag);

  var numbers = document.getElementById('numbers');
  var numFrag = document.createDocumentFragment();
  for (var n = 1; n <= 12; n++) {
    var a = (n * 30) * Math.PI / 180;
    var r = 338;
    var t = document.createElementNS(SVG_NS, 'text');
    t.setAttribute('x', (CX + r * Math.sin(a)).toFixed(2));
    t.setAttribute('y', (CY - r * Math.cos(a)).toFixed(2));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-size', '100');
    t.setAttribute('font-weight', '800');
    t.setAttribute('fill', '#1b2a49');
    t.textContent = n;
    numFrag.appendChild(t);
  }
  numbers.appendChild(numFrag);

  var hourHand   = document.getElementById('hourHand');
  var minuteHand = document.getElementById('minuteHand');
  function setAngle(el, deg) {
    var v = deg.toFixed(2);
    if (el.getAttribute('data-a') !== v) {
      el.setAttribute('data-a', v);
      el.setAttribute('transform', 'rotate(' + v + ' ' + CX + ' ' + CY + ')');
    }
  }

  var dHM    = document.getElementById('d-hm');
  var dateEl = document.getElementById('date');
  var answerEl = document.getElementById('answer');
  var btnShowAnswer = document.getElementById('btnShowAnswer');
  var WEEK   = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var showAnswerFlag = false;

  btnShowAnswer.onclick = function(){
    showAnswerFlag = !showAnswerFlag;
    if(showAnswerFlag){
      answerEl.classList.remove('hidden');
      btnShowAnswer.textContent = "隐藏答案";
    }else{
      answerEl.classList.add('hidden');
      btnShowAnswer.textContent = "显示答案";
    }
  };

  function padMin(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function timeToEnglish(h24, mi){
    var h12 = h24 % 12;
    if(h12 === 0) h12 = 12;
    if(mi === 0){
      return `It's ${h12} o'clock.`;
    }else{
      return `It's ${h12}:${padMin(mi)}.`;
    }
  }

  var frozenTime = null;

  function render() {
    var now = frozenTime || new Date();
    var h24 = now.getHours();
    var mi  = now.getMinutes();
    var h12 = h24 % 12;
    if(h12 === 0) h12 = 12;
    var hourDeg   = (h12 + mi / 60) * 30;
    var minuteDeg = mi * 6;
    setAngle(hourHand, hourDeg);
    setAngle(minuteHand, minuteDeg);

    // 左下角数字面板改为12小时制
    var display12h = h24 % 12;
    if(display12h === 0) display12h = 12;
    dHM.textContent = display12h + ':' + padMin(mi);

    var realToday = new Date();
    dateEl.textContent = realToday.getFullYear() + '年' + (realToday.getMonth() + 1) + '月' +
                         realToday.getDate() + '日  ' + WEEK[realToday.getDay()];

    answerEl.textContent = timeToEnglish(h24, mi);
  }

  render();
  setInterval(render, 1000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) render();
  });

  function getRandomHourly() {
    var d = new Date();
    d.setHours(Math.floor(Math.random() * 24));
    d.setMinutes(0);
    d.setSeconds(0);
    return d;
  }
  function getRandomHalfHourly() {
    var d = new Date();
    d.setHours(Math.floor(Math.random() * 24));
    d.setMinutes(30);
    d.setSeconds(0);
    return d;
  }
  function getRandomRandom() {
    var d = new Date();
    d.setHours(Math.floor(Math.random() * 24));
    d.setMinutes(Math.floor(Math.random() * 60));
    d.setSeconds(0);
    return d;
  }

  document.getElementById('btnHour').addEventListener('click', function () {
    frozenTime = getRandomHourly();
    render();
  });
  document.getElementById('btnHalf').addEventListener('click', function () {
    frozenTime = getRandomHalfHourly();
    render();
  });
  document.getElementById('btnRandom').addEventListener('click', function () {
    frozenTime = getRandomRandom();
    render();
  });
  document.getElementById('btnLive').addEventListener('click', function () {
    frozenTime = null;
    render();
  });

  var dragging = null;
  var svgEl = document.getElementById('clock');

  function getPointerAngle(evt){
    var rect = svgEl.getBoundingClientRect();
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    var cxSvg = rect.width / 2;
    var cySvg = rect.height / 2;
    var dx = x - cxSvg;
    var dy = y - cySvg;
    var rad = Math.atan2(dx, -dy);
    var deg = rad * 180 / Math.PI;
    if(deg < 0) deg += 360;
    return deg;
  }

  function onDragStart(type, evt){
    evt.preventDefault();
    dragging = type;
    frozenTime = frozenTime || new Date();
  }
  function onDragMove(evt){
    if(!dragging) return;
    evt.preventDefault();
    var deg = getPointerAngle(evt);
    if(dragging === 'minute'){
      var minStep = Math.round(deg / 30) * 5;
      frozenTime.setMinutes(minStep);
      frozenTime.setSeconds(0);
    }else if(dragging === 'hour'){
      var hour12 = Math.round(deg / 30);
      if(hour12 === 12) hour12 = 0;
      frozenTime.setHours(hour12);
      frozenTime.setSeconds(0);
    }
    render();
  }
  function onDragEnd(){
    dragging = null;
  }

  hourHand.addEventListener('mousedown', (e)=>onDragStart('hour', e));
  minuteHand.addEventListener('mousedown', (e)=>onDragStart('minute', e));
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);

  hourHand.addEventListener('touchstart', (e)=>onDragStart('hour', e));
  minuteHand.addEventListener('touchstart', (e)=>onDragStart('minute', e));
  document.addEventListener('touchmove', onDragMove, {passive:false});
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('touchcancel', onDragEnd);

  var pinkImg = document.getElementById('pinkFriend');
  var blueImg = document.getElementById('blueFriend');
  try {
    var pinkData = localStorage.getItem('clockPinkFriend');
    var blueData = localStorage.getItem('clockBlueFriend');
    if (pinkData) pinkImg.setAttribute('href', pinkData);
    if (blueData) blueImg.setAttribute('href', blueData);
  } catch (e) {
  }
})();
</script>
</body>
</html>
